services:
  auth_middleware_test:
    image: pennsieve/auth_middleware-test:${VERSION}
    build:
      context: .
      dockerfile: test/Dockerfile
    networks:
      - auth_middleware
    command: ["pytest"]
  auth_middleware:
    image: pennsieve/auth_middleware:${VERSION}
    build:
      context: .
      dockerfile: Dockerfile
    # TWINE_PASSWORD is a CodeArtifact token (see the Jenkinsfile's release stage).
    environment:
      - TWINE_USERNAME=aws
      - TWINE_PASSWORD
      - TWINE_REPOSITORY_URL=https://pennsieve-932986170183.d.codeartifact.us-east-1.amazonaws.com/pypi/pypi/
    command: ["twine", "upload", "dist/*"]
networks:
  auth_middleware:
